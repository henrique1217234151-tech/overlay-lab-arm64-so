plugins { id 'com.android.application' }

android {
    namespace 'com.example.overlaylab'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.overlaylab'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'

        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17'; targets 'overlay_host', 'overlay_plugin' } }
    }

    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' }
    }

    buildTypes { release { minifyEnabled false } }
}
